<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA Manifest & Icons -->
    <link id="pwa-manifest" rel="manifest" href="/manifest.json" />
    <link id="apple-touch-icon" rel="apple-touch-icon" href="/logo.svg" />

    <!-- PWA & Mobile Meta Tags -->
    <meta id="pwa-theme-color" name="theme-color" content="#b80035" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta id="apple-app-title" name="apple-mobile-web-app-title" content="DGustAR" />
    <meta name="description" content="DGustAR: Menú gastronómico interactivo con Realidad Aumentada 3D en mesa, pedidos instantáneos y cocina en tiempo real." />
    
    <!-- Google Fonts: Plus Jakarta Sans & Material Symbols Outlined -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

    <title>DGustAR — Menú Digital con Realidad Aumentada</title>
    <style>
      #qr-entry-lock {
        position: fixed;
        inset: 0;
        z-index: 9000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f8f9ff;
        color: #172033;
        text-align: center;
      }
      #qr-entry-lock[hidden] { display: none; }
      #qr-entry-lock button {
        margin-top: 16px;
        border: 0;
        border-radius: 14px;
        padding: 12px 18px;
        background: #b80035;
        color: white;
        font-weight: 800;
        cursor: pointer;
      }
    </style>
    <script>
      // Una entrada nueva al menú debe comenzar con el QR de la mesa.
      // La mesa se conserva mientras el usuario navega dentro de la PWA,
      // pero no se reutiliza automáticamente al abrir una nueva entrada.
      (() => {
        const path = window.location.pathname;
        const hasTableFromQr = new URLSearchParams(window.location.search).has("mesa");
        if ((path === "/" || path === "/menu") && !hasTableFromQr) {
          [
            "ar_menu_active_visit_table",
            "ar_menu_active_visit_time",
            "ar_menu_table",
            "ar_menu_table_time",
            "ar_menu_table_session"
          ].forEach((key) => {
            localStorage.removeItem(key);
            sessionStorage.removeItem(key);
          });
        }

        if ((path === "/" || path === "/menu") && !hasTableFromQr) {
          let qrScannerOpened = false;
          const openQrScanner = () => {
            if (qrScannerOpened) return;
            const button = document.querySelector('button[aria-label="Mesa física verificada por QR"]');
            if (button && (button.textContent || "").includes("Escanear mesa")) {
              qrScannerOpened = true;
              button.click();
            }
          };
          new MutationObserver(openQrScanner).observe(document.documentElement, {
            childList: true,
            subtree: true
          });
          setTimeout(openQrScanner, 100);
        }
      })();

      // Quita la sección heredada de nómina que sigue dentro del bundle
      // distribuido. El personal accede únicamente con su PIN desde el panel.
      (() => {
        const hideRemovedEmployeeTab = () => {
          document.querySelectorAll("button").forEach((button) => {
            const label = (button.textContent || "").replace(/\s+/g, " ").trim();
            if (/Personal\s*&\s*Empleados/i.test(label)) button.remove();
          });
          document.querySelectorAll("h1,h2,h3").forEach((heading) => {
            const label = (heading.textContent || "").replace(/\s+/g, " ").trim();
            if (!/Nómina y Personal del Restaurante/i.test(label)) return;
            const section = heading.closest("section, article") || heading.parentElement?.parentElement?.parentElement;
            section?.remove();
          });
        };
        new MutationObserver(hideRemovedEmployeeTab).observe(document.documentElement, {
          childList: true,
          subtree: true
        });
        hideRemovedEmployeeTab();
      })();

      (() => {
        const path = window.location.pathname;
        const params = new URLSearchParams(window.location.search);
        const setupQrEntryLock = () => {
          const lock = document.getElementById("qr-entry-lock");
          if (!lock) return;
        const hasTable = () => params.has("mesa") || Boolean(
          localStorage.getItem("ar_menu_table") ||
          sessionStorage.getItem("ar_menu_table_session") ||
          localStorage.getItem("ar_menu_active_visit_table") ||
          sessionStorage.getItem("ar_menu_active_visit_table")
        );

        if (lock && (path === "/" || path === "/menu") && !hasTable()) {
          lock.hidden = false;
          const openScanner = () => {
            const button = document.querySelector('button[aria-label="Mesa física verificada por QR"]');
            if (button && (button.textContent || "").includes("Escanear mesa")) button.click();
          };
          document.getElementById("qr-lock-open")?.addEventListener("click", openScanner);
          const timer = window.setInterval(() => {
            if (hasTable()) {
              lock.hidden = true;
              window.clearInterval(timer);
            } else {
              openScanner();
            }
          }, 250);
        } else if (lock) {
          lock.hidden = true;
        }
        };
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", setupQrEntryLock, { once: true });
        } else {
          setupQrEntryLock();
        }
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-CebOQXM1.js?v=7"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BV5RYNIR.css?v=7">
  </head>
  <body class="bg-surface text-on-surface antialiased selection:bg-primary-fixed selection:text-on-primary-fixed">
    <div id="app"></div>
    <div id="qr-entry-lock" hidden>
      <div>
        <div style="font-size: 48px">📍</div>
        <h1 style="margin: 12px 0 8px; font-size: 22px">Escanea el QR de tu mesa</h1>
        <p style="margin: 0; color: #596579">Debes validar la mesa antes de consultar el menú.</p>
        <button id="qr-lock-open" type="button">Abrir escáner QR</button>
      </div>
    </div>
  </body>
</html>
