  <script>
    // Una entrada nueva al menú debe comenzar con el QR de la mesa.
    // La mesa se conserva mientras el usuario navega dentro de la PWA,
    // pero no se reutiliza automáticamente al abrir una nueva entrada.
    (() => {
      const path = window.location.pathname;
      const hasTableFromQr = new URLSearchParams(window.location.search).has("mesa");
      const savedOrderToken = localStorage.getItem("ar_menu_active_visit_order") ||
        sessionStorage.getItem("ar_menu_active_visit_order");
      const savedOrdersRaw = localStorage.getItem("ar_menu_active_visit_orders_list") ||
        sessionStorage.getItem("ar_menu_active_visit_orders_list");
      let savedOrders = [];
      try {
        const parsedOrders = JSON.parse(savedOrdersRaw || "[]");
        savedOrders = Array.isArray(parsedOrders) ? parsedOrders : [];
      } catch { /* datos locales dañados: se solicitará el QR */ }
      const activeStates = new Set(["NUEVO", "ACEPTADO", "EN_PREPARACION", "LISTO"]);
      const activeSavedOrder = savedOrders.find((order) =>
        order && order.order_token === savedOrderToken && activeStates.has(order.estado)
      ) || savedOrders.find((order) => order && activeStates.has(order.estado));
      const savedVisitTime = Number(localStorage.getItem("ar_menu_active_visit_time") ||
        sessionStorage.getItem("ar_menu_active_visit_time") || 0);
      const hasRecoverableOrder = Boolean(activeSavedOrder && savedVisitTime &&
        Date.now() - savedVisitTime < 2 * 60 * 60 * 1000);

      // Solo se conserva la sesión durante 2 horas y mientras la comanda siga activa.
      if (hasRecoverableOrder) {
        localStorage.setItem("ar_menu_active_visit_time", String(Date.now()));
        localStorage.setItem("ar_menu_active_visit_order", activeSavedOrder.order_token);
        if (activeSavedOrder.mesa) {
          localStorage.setItem("ar_menu_active_visit_table", activeSavedOrder.mesa);
          localStorage.setItem("ar_menu_table", activeSavedOrder.mesa);
        }
      }

      if ((path === "/" || path === "/menu" || path.startsWith("/pedido")) &&
        !hasTableFromQr && !hasRecoverableOrder) {
        [
          "ar_menu_active_visit_table",
          "ar_menu_active_visit_time",
          "ar_menu_active_visit_order",
          "ar_menu_active_visit_orders_list",
          "ar_menu_table",
          "ar_menu_table_time",
          "ar_menu_table_session"
        ].forEach((key) => {
          localStorage.removeItem(key);
          sessionStorage.removeItem(key);
        });
      }

      if ((path === "/" || path === "/menu") && !hasTableFromQr) {
        let qrScannerOpened = false;
        const openQrScanner = () => {
          if (qrScannerOpened) return;
          const button = document.querySelector('button[aria-label="Mesa física verificada por QR"]');
          if (button && (button.textContent || "").includes("Escanear mesa")) {
            qrScannerOpened = true;
            button.click();
          }
        };
        new MutationObserver(openQrScanner).observe(document.documentElement, {
          childList: true,
          subtree: true
        });
        setTimeout(openQrScanner, 100);
      }
    })();

    // Quita la sección heredada de nómina que sigue dentro del bundle
    // distribuido. El personal accede únicamente con su PIN desde el panel.
    (() => {
      const hideRemovedEmployeeTab = () => {
        document.querySelectorAll("button").forEach((button) => {
          const label = (button.textContent || "").replace(/\s+/g, " ").trim();
          if (/Personal\s*&\s*Empleados/i.test(label)) button.remove();
        });
        document.querySelectorAll("h1,h2,h3").forEach((heading) => {
          const label = (heading.textContent || "").replace(/\s+/g, " ").trim();
          if (!/Nómina y Personal del Restaurante/i.test(label)) return;
          const section = heading.closest("section, article") || heading.parentElement?.parentElement?.parentElement;
          section?.remove();
        });
      };
      new MutationObserver(hideRemovedEmployeeTab).observe(document.documentElement, {
        childList: true,
        subtree: true
      });
      hideRemovedEmployeeTab();
    })();

    (() => {
      const path = window.location.pathname;
      const params = new URLSearchParams(window.location.search);
      const setupQrEntryLock = () => {
        const lock = document.getElementById("qr-entry-lock");
        if (!lock) return;
        const hasTable = () => params.has("mesa") || Boolean(
          localStorage.getItem("ar_menu_table") ||
          sessionStorage.getItem("ar_menu_table_session") ||
          localStorage.getItem("ar_menu_active_visit_table") ||
          sessionStorage.getItem("ar_menu_active_visit_table")
        );

        if (lock && (path === "/" || path === "/menu") && !hasTable()) {
          lock.hidden = false;
          const openScanner = () => {
            const button = document.querySelector('button[aria-label="Mesa física verificada por QR"]');
            if (button && (button.textContent || "").includes("Escanear mesa")) button.click();
          };
          document.getElementById("qr-lock-open")?.addEventListener("click", openScanner);
          const timer = window.setInterval(() => {
            if (hasTable()) {
              lock.hidden = true;
              window.clearInterval(timer);
            } else {
              openScanner();
            }
          }, 250);
        } else if (lock) {
          lock.hidden = true;
        }
      };
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", setupQrEntryLock, { once: true });
      } else {
        setupQrEntryLock();
      }
    })();
  </script>

  <!-- El personal puede cobrar, pero no necesita consultar el reporte de caja.
       Evita que el 401 esperado de ese reporte se interprete como sesión vencida. -->
  <script>
    (() => {
      const nativeFetch = window.fetch.bind(window);
      window.fetch = async (...args) => {
        const response = await nativeFetch(...args);
        const request = args[0];
        const url = typeof request === 'string' ? request : request?.url || '';
        if (response.status === 401 &&
          url.includes('/api/admin/corte-caja/report') &&
          localStorage.getItem('bistro_admin_role') === 'STAFF') {
          return new Response(JSON.stringify({
            periodo: 'shift',
            total_ventas: 0,
            total_efectivo: 0,
            total_terminal: 0,
            orders: [],
            top_productos: []
          }), {
            status: 200,
            headers: { 'Content-Type': 'application/json' }
          });
        }
        return response;
      };
    })();
  </script>

  <!-- Monto recibido y cambio para cobros en efectivo. -->
  <script>
    (() => {
      let cashPayment = null;

      const money = (value) => Number(String(value || '').replace(/[$,\s]/g, '')) || 0;
      const locatePaymentModal = () => [...document.querySelectorAll('div.fixed.inset-0')]
        .find((modal) => /Registrar Cobro en Caja/i.test(modal.textContent || ''));

      const enhanceCashPayment = () => {
        const modal = locatePaymentModal();
        if (!modal) {
          cashPayment = null;
          return;
        }

        const methodButtons = [...modal.querySelectorAll('button')].filter((button) =>
          /Efectivo|Terminal Bancaria/i.test(button.textContent || '')
        );
        const terminalSelected = methodButtons.some((button) =>
          /Terminal Bancaria/i.test(button.textContent || '') && /bg-blue-500\/20/.test(button.className)
        );

        let fields = modal.querySelector('[data-cash-payment-fields]');
        if (!fields) {
          fields = document.createElement('div');
          fields.dataset.cashPaymentFields = 'true';
          fields.className = 'cash-payment-fields';
          fields.innerHTML = `
            <label class="cash-payment-fields__label" for="cash-received-amount">Efectivo recibido</label>
            <div class="cash-payment-fields__input-wrap">
              <span>$</span>
              <input id="cash-received-amount" inputmode="decimal" type="number" min="0" step="0.01" placeholder="0.00" autocomplete="off">
            </div>
            <div class="cash-payment-fields__change" aria-live="polite">
              <span>Cambio a entregar</span><strong>$0.00</strong>
            </div>`;
          const actionArea = [...modal.querySelectorAll('button')].find((button) =>
            /Confirmar Cobro/i.test(button.textContent || '')
          )?.parentElement;
          (actionArea || modal).before(fields);
          fields.querySelector('input').addEventListener('input', () => updateCashPayment(modal, fields));
        }

        if (fields.hidden !== terminalSelected) fields.hidden = terminalSelected;
        if (!terminalSelected) updateCashPayment(modal, fields);
      };

      const updateCashPayment = (modal, fields) => {
        const totalLabel = [...modal.querySelectorAll('span')].find((el) => /^Total a Cobrar$/i.test((el.textContent || '').trim()));
        const total = money(totalLabel?.nextElementSibling?.textContent);
        const input = fields.querySelector('input');
        const received = money(input.value);
        const change = Math.max(0, received - total);
        const changeLabel = fields.querySelector('strong'); const changeText = `$${change.toFixed(2)}`; if (changeLabel.textContent !== changeText) changeLabel.textContent = changeText;
        fields.classList.toggle('is-invalid', received > 0 && received < total);
        cashPayment = { input, total };
      };

      const originalFetchWithCash = window.fetch.bind(window);
      window.fetch = async (...args) => {
        const request = args[0];
        const url = typeof request === 'string' ? request : request?.url || '';
        const options = args[1] || {};
        if (url.includes('/api/admin/payments') && options.method === 'POST' && cashPayment) {
          try {
            const body = JSON.parse(options.body || '{}');
            if (body.method === 'EFECTIVO') {
              const received = money(cashPayment.input.value);
              if (!received || received < cashPayment.total) {
                return new Response(JSON.stringify({ error: 'Ingresa un efectivo igual o mayor al total.' }), {
                  status: 400,
                  headers: { 'Content-Type': 'application/json' }
                });
              }
              body.received_amount = received;
              body.change = Number((received - cashPayment.total).toFixed(2));
              args[1] = { ...options, body: JSON.stringify(body) };
            }
          } catch { /* El flujo original mostrará su propio error. */ }
        }
        return originalFetchWithCash(...args);
      };

      new MutationObserver(enhanceCashPayment).observe(document.documentElement, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: ['class', 'hidden']
      });
      enhanceCashPayment();
    })();
  </script>

  <!-- Flujo de personalización desde el listado del menú.
       El bundle distribuye el botón + como alta directa; aquí lo convertimos
       en acceso a la ficha para que el comensal pueda personalizar primero. -->
  <script>
    (() => {
      const isMenuRoute = () => window.location.pathname === '/menu';
      const isDishRoute = () => window.location.pathname.startsWith('/platillo/');

      document.addEventListener('click', (event) => {
        if (!isMenuRoute()) return;
        const addButton = event.target.closest?.('button[title="Agregar 1 al carrito"]');
        if (!addButton) return;

        let card = addButton.parentElement;
        while (card && card !== document.body) {
          if (card !== addButton && card.classList?.contains('cursor-pointer') && card.querySelector('img')) break;
          card = card.parentElement;
        }
        if (!card || card === document.body) return;

        event.preventDefault();
        event.stopImmediatePropagation();
        card.click();
      }, true);

      const keepDishActionsVisible = () => {
        if (!isDishRoute()) return;
        const main = [...document.querySelectorAll('main')].find((element) =>
          element.classList.contains('max-w-lg') && element.classList.contains('flex-1')
        );
        if (main) {
          main.style.paddingBottom = '9rem';
          main.style.scrollPaddingBottom = '9rem';
        }
      };

      const originalPushState = history.pushState;
      history.pushState = function (...args) {
        const result = originalPushState.apply(this, args);
        setTimeout(keepDishActionsVisible, 0);
        return result;
      };
      window.addEventListener('popstate', keepDishActionsVisible);
      new MutationObserver(keepDishActionsVisible).observe(document.documentElement, {
        childList: true,
        subtree: true
      });
      keepDishActionsVisible();
    })();
  </script>

  <!-- Ajustes de flujo para el bundle distribuido sin fuente de Vue en este repositorio. -->
  <script>
    (() => {
      const normalize = (value) => String(value || '').replace(/\s+/g, ' ').trim();

      const repairMenuActions = () => {
        // En el menú normal, el botón rápido no debe saltarse ingredientes y extras.
        document.querySelectorAll('button[title="Agregar 1 al carrito"]').forEach((button) => {
          const card = button.closest('.cursor-pointer');
          if (!card || button.dataset.customizeReady === '1') return;
          const replacement = button.cloneNode(true);
          replacement.dataset.customizeReady = '1';
          replacement.title = 'Personalizar y pedir';
          replacement.className = replacement.className
            .replace(/w-8 h-8 rounded-full/g, 'min-h-8 px-2 rounded-full')
            .replace('justify-center', 'justify-center gap-1');
          replacement.innerHTML = '<span class="material-symbols-outlined text-[16px]">tune</span><span class="text-[10px] font-extrabold">Personalizar</span>';
          replacement.addEventListener('click', (event) => {
            event.preventDefault();
            event.stopPropagation();
            card.click();
          });
          button.replaceWith(replacement);
        });

        // Hace explícito el mismo flujo en el detalle normal y en el visor 3D.
        document.querySelectorAll('button').forEach((button) => {
          if (normalize(button.textContent).toLowerCase().startsWith('agregar al pedido')) {
            const label = button.querySelector('span.text-xs, span.text-sm');
            if (label) label.textContent = 'PERSONALIZAR Y PEDIR';
          }
        });
      };

      const observer = new MutationObserver(repairMenuActions);
      const start = () => {
        repairMenuActions();
        observer.observe(document.body, { childList: true, subtree: true });
      };
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, { once: true });
      else start();
    })();
  </script>

  <!-- ══════════════════════════════════════════════════════════════════
       Prefetch de Modelos 3D en tiempo de inactividad del navegador
       Se ejecuta sólo cuando el hilo principal está libre (requestIdleCallback).
       No bloquea ni afecta la carga inicial de la PWA.
       ══════════════════════════════════════════════════════════════════ -->
  <script>
    (function () {
      var MODELS = [
        '/models/burger.glb',
        '/models/pizza.glb',
        '/models/fries.glb',
        '/models/drink.glb',
        '/models/coffee.glb',
        '/models/dessert.glb'
      ];

      function prefetchModels() {
        // Verificar si ya están en caché antes de descargar
        if ('caches' in window) {
            caches.open('dgustar-pwa-v9').then(function (cache) {
            MODELS.forEach(function (url) {
              cache.match(url).then(function (cached) {
                if (!cached) {
                  // No está en caché — lo descargamos con prioridad baja
                  fetch(url, { priority: 'low' })
                    .then(function (res) {
                      if (res.ok) {
                        cache.put(url, res);
                        console.log('[3D] Modelo precargado:', url);
                      }
                    })
                    .catch(function () { /* Sin conexión — el SW lo intentará luego */ });
                }
              });
            });
          });
        } else {
          // Fallback: fetch simple sin verificar caché
          MODELS.forEach(function (url) {
            fetch(url, { priority: 'low' }).catch(function () { });
          });
        }
      }

      // Esperar a que la página esté completamente cargada e idle
      if ('requestIdleCallback' in window) {
        window.addEventListener('load', function () {
          requestIdleCallback(prefetchModels, { timeout: 5000 });
        });
      } else {
        // Safari fallback: esperar 4 segundos después del load
        window.addEventListener('load', function () {
          setTimeout(prefetchModels, 4000);
        });
      }
    })();
  </script>

  <!-- ══════════════════════════════════════════════════════════════════
         Google Maps Deep Link Booster
         Intercepta cualquier intento de abrir una reseña de Google Maps
         y fuerza la apertura en la app nativa (Maps) en lugar del navegador.
         Funciona en modo PWA standalone, Chrome, Safari y WebView.
         ══════════════════════════════════════════════════════════════════ -->
  <script>
    (function () {
      'use strict';

      // Abre la app de Google Maps para dejar reseña usando el mejor método
      // disponible según el dispositivo. Devuelve true si lanzó un deep link.
      function openMapsAppForReview(placeId, fallbackUrl) {
        if (!placeId) {
          window.open(fallbackUrl || 'https://maps.google.com', '_blank', 'noopener,noreferrer');
          return false;
        }

        var isIOS = /iP(hone|od|ad)/.test(navigator.userAgent);
        var isAndroid = /Android/i.test(navigator.userAgent);

        if (isIOS) {
          // iOS: comgooglemaps:// abre la app de Google Maps directamente
          var iosUrl = 'comgooglemaps://?action=writereview&placeid=' + placeId;
          var fallback = fallbackUrl || ('https://search.google.com/local/writereview?placeid=' + placeId);

          // Intentamos abrir la app. Si no está instalada, el iframe no hace nada
          // y el setTimeout abre el fallback en Safari (que iOS Maps puede interceptar)
          var iframe = document.createElement('iframe');
          iframe.style.cssText = 'position:fixed;top:-9999px;width:1px;height:1px;border:0;';
          document.body.appendChild(iframe);
          var launched = false;

          window.addEventListener('blur', function onBlur() {
            launched = true;
            window.removeEventListener('blur', onBlur);
          }, { once: true });

          try { iframe.contentWindow.location.href = iosUrl; } catch (e) { }
          iframe.src = iosUrl;

          setTimeout(function () {
            document.body.removeChild(iframe);
            if (!launched) {
              // Maps no está instalado: abrimos web de Google Maps
              window.location.href = fallback;
            }
          }, 2000);

        } else if (isAndroid) {
          // Android: intent:// abre directo la app de Maps sin pasar por Chrome
          var reviewUrl = 'https://search.google.com/local/writereview?placeid=' + placeId;
          var intentUrl = 'intent://maps.google.com/maps?action=writereview&placeid=' + placeId
            + '#Intent;scheme=https;package=com.google.android.apps.maps'
            + ';S.browser_fallback_url=' + encodeURIComponent(reviewUrl)
            + ';end';
          window.location.href = intentUrl;

        } else {
          // Desktop u otro dispositivo: abrir en pestaña nueva
          var webUrl = fallbackUrl || ('https://search.google.com/local/writereview?placeid=' + placeId);
          window.open(webUrl, '_blank', 'noopener,noreferrer');
        }
        return true;
      }

      // Exponer globalmente para que el bundle pueda llamarla si quiere,
      // pero principalmente interceptamos los clicks del DOM.
      window.__dgustar_openMapsReview = openMapsAppForReview;

      // Interceptor de clicks: cuando el usuario toca cualquier enlace/botón
      // que apunta a search.google.com/local/writereview o g.page/r/,
      // lo redirigimos por nuestro método mejorado.
      document.addEventListener('click', function (e) {
        var el = e.target;
        // Buscar el <a> más cercano aunque se haga click en un hijo
        while (el && el.tagName !== 'A') el = el.parentElement;
        if (!el) return;

        var href = el.getAttribute('href') || '';
        var isReviewLink = href.includes('writereview') || href.includes('g.page/r/');
        if (!isReviewLink) return;

        // Extraer el placeId de la URL si lo tiene
        var placeIdMatch = href.match(/placeid=([^&]+)/);
        var placeId = placeIdMatch ? placeIdMatch[1] : null;

        // Si el placeId es un placeholder o no existe, dejar pasar normal
        if (!placeId || placeId.includes('CONFIGURA') || placeId.includes('sample')) return;

        e.preventDefault();
        e.stopPropagation();
        openMapsAppForReview(placeId, href);
      }, true); // useCapture: true para interceptar antes que el bundle

    })();
  </script>
