    #qr-entry-lock {
      position: fixed;
      inset: 0;

  <script>
    // Una entrada nueva al menú debe comenzar con el QR de la mesa.
    // La mesa se conserva mientras el usuario navega dentro de la PWA,
    // pero no se reutiliza automáticamente al abrir una nueva entrada.
    (() => {
      const path = window.location.pathname;
      const hasTableFromQr = new URLSearchParams(window.location.search).has("mesa");
      if ((path === "/" || path === "/menu") && !hasTableFromQr) {
        [
          "ar_menu_active_visit_table",
          "ar_menu_active_visit_time",
          "ar_menu_table",
          "ar_menu_table_time",
          "ar_menu_table_session"
        ].forEach((key) => {
          localStorage.removeItem(key);
          sessionStorage.removeItem(key);
        });
      }

      if ((path === "/" || path === "/menu") && !hasTableFromQr) {
        let qrScannerOpened = false;
        const openQrScanner = () => {
          if (qrScannerOpened) return;
          const button = document.querySelector('button[aria-label="Mesa física verificada por QR"]');
          if (button && (button.textContent || "").includes("Escanear mesa")) {
            qrScannerOpened = true;
            button.click();
          }
        };
        new MutationObserver(openQrScanner).observe(document.documentElement, {
          childList: true,
          subtree: true
        });
        setTimeout(openQrScanner, 100);
      }
    })();

    // Quita la sección heredada de nómina que sigue dentro del bundle
    // distribuido. El personal accede únicamente con su PIN desde el panel.
    (() => {
      const hideRemovedEmployeeTab = () => {
        document.querySelectorAll("button").forEach((button) => {
          const label = (button.textContent || "").replace(/\s+/g, " ").trim();
          if (/Personal\s*&\s*Empleados/i.test(label)) button.remove();
        });
        document.querySelectorAll("h1,h2,h3").forEach((heading) => {
          const label = (heading.textContent || "").replace(/\s+/g, " ").trim();
          if (!/Nómina y Personal del Restaurante/i.test(label)) return;
          const section = heading.closest("section, article") || heading.parentElement?.parentElement?.parentElement;
          section?.remove();
        });
      };
      new MutationObserver(hideRemovedEmployeeTab).observe(document.documentElement, {
        childList: true,
        subtree: true
      });
      hideRemovedEmployeeTab();
    })();

    (() => {
      const path = window.location.pathname;
      const params = new URLSearchParams(window.location.search);
      const setupQrEntryLock = () => {
        const lock = document.getElementById("qr-entry-lock");
        if (!lock) return;
        const hasTable = () => params.has("mesa") || Boolean(
          localStorage.getItem("ar_menu_table") ||
          sessionStorage.getItem("ar_menu_table_session") ||
          localStorage.getItem("ar_menu_active_visit_table") ||
          sessionStorage.getItem("ar_menu_active_visit_table")
        );

        if (lock && (path === "/" || path === "/menu") && !hasTable()) {
          lock.hidden = false;
          const openScanner = () => {
            const button = document.querySelector('button[aria-label="Mesa física verificada por QR"]');
            if (button && (button.textContent || "").includes("Escanear mesa")) button.click();
          };
          document.getElementById("qr-lock-open")?.addEventListener("click", openScanner);
          const timer = window.setInterval(() => {
            if (hasTable()) {
              lock.hidden = true;
              window.clearInterval(timer);
            } else {
              openScanner();
            }
          }, 250);
        } else if (lock) {
          lock.hidden = true;
        }
      };
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", setupQrEntryLock, { once: true });
      } else {
        setupQrEntryLock();
      }
    })();
  </script>

  <!-- ══════════════════════════════════════════════════════════════════
       Service Worker — PWA offline + cache de modelos 3D
       ══════════════════════════════════════════════════════════════════ -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').then(function (reg) {
          console.log('[PWA] Service Worker registrado:', reg.scope);
        }).catch(function (err) {
          console.warn('[PWA] SW no pudo registrarse:', err);
        });
      });
    }
  </script>

  <!-- ══════════════════════════════════════════════════════════════════
       Prefetch de Modelos 3D en tiempo de inactividad del navegador
       Se ejecuta sólo cuando el hilo principal está libre (requestIdleCallback).
       No bloquea ni afecta la carga inicial de la PWA.
       ══════════════════════════════════════════════════════════════════ -->
  <script>
    (function () {
      var MODELS = [
        '/models/burger.glb',
        '/models/pizza.glb',
        '/models/fries.glb',
        '/models/drink.glb',
        '/models/coffee.glb',
        '/models/dessert.glb'
      ];

      function prefetchModels() {
        // Verificar si ya están en caché antes de descargar
        if ('caches' in window) {
          caches.open('dgustar-pwa-v8').then(function (cache) {
            MODELS.forEach(function (url) {
              cache.match(url).then(function (cached) {
                if (!cached) {
                  // No está en caché — lo descargamos con prioridad baja
                  fetch(url, { priority: 'low' })
                    .then(function (res) {
                      if (res.ok) {
                        cache.put(url, res);
                        console.log('[3D] Modelo precargado:', url);
                      }
                    })
                    .catch(function () { /* Sin conexión — el SW lo intentará luego */ });
                }
              });
            });
          });
        } else {
          // Fallback: fetch simple sin verificar caché
          MODELS.forEach(function (url) {
            fetch(url, { priority: 'low' }).catch(function () { });
          });
        }
      }

      // Esperar a que la página esté completamente cargada e idle
      if ('requestIdleCallback' in window) {
        window.addEventListener('load', function () {
          requestIdleCallback(prefetchModels, { timeout: 5000 });
        });
      } else {
        // Safari fallback: esperar 4 segundos después del load
        window.addEventListener('load', function () {
          setTimeout(prefetchModels, 4000);
        });
      }
    })();
  </script>

  <!-- ══════════════════════════════════════════════════════════════════
         Google Maps Deep Link Booster
         Intercepta cualquier intento de abrir una reseña de Google Maps
         y fuerza la apertura en la app nativa (Maps) en lugar del navegador.
         Funciona en modo PWA standalone, Chrome, Safari y WebView.
         ══════════════════════════════════════════════════════════════════ -->
  <script>
    (function () {
      'use strict';

      // Abre la app de Google Maps para dejar reseña usando el mejor método
      // disponible según el dispositivo. Devuelve true si lanzó un deep link.
      function openMapsAppForReview(placeId, fallbackUrl) {
        if (!placeId) {
          window.open(fallbackUrl || 'https://maps.google.com', '_blank', 'noopener,noreferrer');
          return false;
        }

        var isIOS = /iP(hone|od|ad)/.test(navigator.userAgent);
        var isAndroid = /Android/i.test(navigator.userAgent);

        if (isIOS) {
          // iOS: comgooglemaps:// abre la app de Google Maps directamente
          var iosUrl = 'comgooglemaps://?action=writereview&placeid=' + placeId;
          var fallback = fallbackUrl || ('https://search.google.com/local/writereview?placeid=' + placeId);

          // Intentamos abrir la app. Si no está instalada, el iframe no hace nada
          // y el setTimeout abre el fallback en Safari (que iOS Maps puede interceptar)
          var iframe = document.createElement('iframe');
          iframe.style.cssText = 'position:fixed;top:-9999px;width:1px;height:1px;border:0;';
          document.body.appendChild(iframe);
          var launched = false;

          window.addEventListener('blur', function onBlur() {
            launched = true;
            window.removeEventListener('blur', onBlur);
          }, { once: true });

          try { iframe.contentWindow.location.href = iosUrl; } catch (e) { }
          iframe.src = iosUrl;

          setTimeout(function () {
            document.body.removeChild(iframe);
            if (!launched) {
              // Maps no está instalado: abrimos web de Google Maps
              window.location.href = fallback;
            }
          }, 2000);

        } else if (isAndroid) {
          // Android: intent:// abre directo la app de Maps sin pasar por Chrome
          var reviewUrl = 'https://search.google.com/local/writereview?placeid=' + placeId;
          var intentUrl = 'intent://maps.google.com/maps?action=writereview&placeid=' + placeId
            + '#Intent;scheme=https;package=com.google.android.apps.maps'
            + ';S.browser_fallback_url=' + encodeURIComponent(reviewUrl)
            + ';end';
          window.location.href = intentUrl;

        } else {
          // Desktop u otro dispositivo: abrir en pestaña nueva
          var webUrl = fallbackUrl || ('https://search.google.com/local/writereview?placeid=' + placeId);
          window.open(webUrl, '_blank', 'noopener,noreferrer');
        }
        return true;
      }

      // Exponer globalmente para que el bundle pueda llamarla si quiere,
      // pero principalmente interceptamos los clicks del DOM.
      window.__dgustar_openMapsReview = openMapsAppForReview;

      // Interceptor de clicks: cuando el usuario toca cualquier enlace/botón
      // que apunta a search.google.com/local/writereview o g.page/r/,
      // lo redirigimos por nuestro método mejorado.
      document.addEventListener('click', function (e) {
        var el = e.target;
        // Buscar el <a> más cercano aunque se haga click en un hijo
        while (el && el.tagName !== 'A') el = el.parentElement;
        if (!el) return;

        var href = el.getAttribute('href') || '';
        var isReviewLink = href.includes('writereview') || href.includes('g.page/r/');
        if (!isReviewLink) return;

        // Extraer el placeId de la URL si lo tiene
        var placeIdMatch = href.match(/placeid=([^&]+)/);
        var placeId = placeIdMatch ? placeIdMatch[1] : null;

        // Si el placeId es un placeholder o no existe, dejar pasar normal
        if (!placeId || placeId.includes('CONFIGURA') || placeId.includes('sample')) return;

        e.preventDefault();
        e.stopPropagation();
        openMapsAppForReview(placeId, href);
      }, true); // useCapture: true para interceptar antes que el bundle

    })();
  </script>
